<!DOCTYPE html>
<html>
<head>
    <title>Museum Day Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page">
        <a class="back-link" href="/">&larr; Home</a>

        <h1>Museum Day Planner</h1>
        <p class="subtitle">Enter a date within the next 16 days to check the weather and get an art recommendation.</p>

        <form method="POST" action="/museum-day/plan">
            <input type="text" name="date" placeholder="YYYY-MM-DD">
            <button type="submit">Check</button>
        </form>
    </div>
</body>
</html>
