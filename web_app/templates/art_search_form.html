<!DOCTYPE html>
<html>
<head>
    <title>Met Art Search</title>
</head>
<body>
    <a href="/">&larr; Home</a>

    <h1>Met Art Search</h1>
    <p>Type a word and get a randomized list of 10 on-view pieces matching it.</p>

    <form method="POST" action="/art-search/results">
        <input type="text" name="search_word" placeholder="e.g. sunflower, cat, armor" size="30">
        <button type="submit">Search</button>
    </form>
</body>
</html>
